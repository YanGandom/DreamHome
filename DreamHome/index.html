<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <title>筑梦小屋 · 把生活装进喜欢的家</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./editor.css">
  <link rel="stylesheet" href="./object-controls.css">
  <link rel="stylesheet" href="./building.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body class="editor-open">
  <main id="scene" aria-label="筑梦小屋三维建造场景"></main>
  <header class="masthead"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M7 19 20 8l13 11v14H7Z"/><path d="M15 33V22h10v11M27 9v7"/></svg></div><div><h1>筑梦小屋</h1><p>A HOME OF YOUR OWN</p></div></header>
  <div class="top-actions">
    <button id="scene-menu-toggle" class="icon-button menu-toggle" aria-label="场景菜单" aria-expanded="false" aria-controls="scene-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <div id="scene-menu" class="scene-menu" hidden aria-label="场景设置">
      <button id="rotate" aria-pressed="false"><span class="menu-icon" aria-hidden="true">↻</span><span>环绕</span><span class="switch" aria-hidden="true"></span></button>
      <button id="snow" class="active" aria-pressed="true"><span class="menu-icon" aria-hidden="true">❄</span><span>飘雪</span><span class="switch" aria-hidden="true"></span></button>
      <button id="night" aria-pressed="false"><span class="menu-icon" aria-hidden="true">☾</span><span>夜景</span><span class="switch" aria-hidden="true"></span></button>
      <button id="capture"><span class="menu-icon" aria-hidden="true">↓</span><span>保存画面</span><span class="menu-end" aria-hidden="true">PNG</span></button>
    </div>
  </div>
  <button id="camera-view-toggle" class="camera-view-toggle" type="button" aria-label="切换到俯视" aria-pressed="false" title="切换到俯视"><span id="camera-top-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4Z M4 12h16 M12 4v16"/></svg></span><span id="camera-original-icon" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5v9l-9 5-9-5Z M3 8l9 5 9-5 M12 13v9"/></svg></span><span id="camera-view-label">俯视</span></button>
  <div class="hint" id="scene-hint">轻点布置 · 拖动环绕 · 双指缩放</div>
  <section id="object-ui" class="object-ui" aria-label="家具操作" hidden>
    <div class="object-card">
      <div id="object-actions" class="object-actions">
        <button id="object-rotate" class="orbit-button" aria-label="旋转"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button>
        <button id="object-color" class="orbit-button" aria-label="改色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-3.7 1.5 1.5 0 0 1 1-2.8h2A4 4 0 0 0 21 10c0-4-4-7-9-7Z"/><circle cx="8" cy="8" r="1"/><circle cx="13" cy="6.5" r="1"/><circle cx="17" cy="9" r="1"/><circle cx="6" cy="13" r="1"/></svg></button>
        <button id="object-material" class="orbit-button" aria-label="墙面材质" title="墙面材质">▧</button>
        <button id="object-delete" class="orbit-button object-delete" aria-label="删除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button>
      </div>
      <div id="object-material-panel" hidden><div id="wall-material-options"></div></div>
      <div id="object-rotation" hidden>
        <svg id="rotation-arc" class="rotation-arc" viewBox="0 0 360 118" role="slider" tabindex="0" aria-label="家具旋转角度" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
          <path class="arc-hit" d="M30 76 A250 250 0 0 1 330 76"/>
          <path class="arc-track" d="M30 76 A250 250 0 0 1 330 76"/>
          <path id="arc-progress" class="arc-progress" d="M30 76"/>
          <path id="arc-ticks" class="arc-ticks"/>
          <circle id="arc-thumb" class="arc-thumb" cx="30" cy="76" r="9"/>
          <text id="arc-value" class="arc-value" x="180" y="88" text-anchor="middle">0°</text>
          <text class="arc-endpoint" x="30" y="105" text-anchor="middle">0°</text><text class="arc-endpoint" x="330" y="105" text-anchor="middle">360°</text>
        </svg>
      </div>
      <div id="object-palette-panel" hidden><div id="object-palette" class="object-palette"></div></div>
      <div id="object-finish" class="object-finish"><button id="object-confirm" class="orbit-button object-confirm" aria-label="完成操作"><span aria-hidden="true">✓</span></button></div>
    </div>
  </section>
  <section id="floor-ui" class="floor-ui" aria-label="地面材质" hidden>
    <div id="floor-options" class="floor-options" role="group" aria-label="选择地面材质"></div>
    <button id="floor-confirm" class="orbit-button object-confirm" aria-label="完成地面材质选择"><span aria-hidden="true">✓</span></button>
  </section>
  <section id="build-ui" class="build-ui" aria-label="建造操作" hidden><output id="build-size"></output><div class="build-actions"><button id="build-rotate" aria-label="旋转" title="旋转">↻</button><button id="build-color" aria-label="更换配色" title="配色">◒</button><button id="build-material" aria-label="更换材质" title="材质">▧</button><button id="build-enter" aria-label="进入房间" title="进入">⇥</button><button id="build-remove" aria-label="删除" title="删除">⌫</button><button id="build-cancel" aria-label="取消" title="取消">×</button><button id="build-confirm" class="confirm" aria-label="完成">✓</button></div><div id="build-options" hidden></div></section>
  <aside id="editor-panel" class="editor-panel" aria-label="组件库">
    <div class="dock-heading"><div class="library-tabs" role="tablist" aria-label="组件列表"><button data-library-tab="catalog" role="tab" aria-selected="true" class="active">布置</button><button data-library-tab="build" role="tab" aria-selected="false">建造</button><button data-library-tab="removed" role="tab" aria-selected="false">收纳 <span id="removed-count">0</span></button><button data-library-tab="placed" role="tab" aria-selected="false">场景</button></div><div class="editor-toolbar"><span id="save-status" role="status">布局自动保存</span><button id="undo-edit" title="撤销 Ctrl+Z" aria-label="撤销" disabled>↶</button><button id="redo-edit" title="重做 Ctrl+Shift+Z" aria-label="重做" disabled>↷</button><button id="edit-mode" class="edit-mode active" aria-label="切换编辑或浏览" aria-pressed="true">编辑</button></div></div>
    <div class="category-row"><div id="library-categories" class="category-chips"><button data-category="all" class="active">全部</button><button data-category="seating">座椅</button><button data-category="tables">桌柜</button><button data-category="lighting">灯具</button><button data-category="plants">植物</button><button data-category="rugs">地毯</button><button data-category="decor">陈设</button><button data-category="mounted">墙饰</button><button data-category="walls">墙体</button></div><div id="build-categories" class="category-chips" hidden><button data-build-category="all" class="active">全部</button><button data-build-category="room">地基</button><button data-build-category="wall">墙体</button><button data-build-category="door">门洞</button><button data-build-category="roof">屋顶</button><button data-build-category="chimney">装饰</button></div><span id="library-total"></span></div>
    <div id="library-list" class="library-list" aria-label="模型列表" tabindex="0"></div>
    <div class="dock-foot"><span id="selection-summary" aria-live="polite">让喜欢的事物，找到自己的位置。</span><span>拖入场景 <span aria-hidden="true">↗</span></span></div>
  </aside>
  <div id="loading"><div class="loading-mark">⌂</div><p id="loading-text">正在布置你的筑梦小屋…</p></div>
  <div id="toast" role="status"></div>
  <script type="module">
    const loading=document.querySelector('#loading');
    const message=document.querySelector('#loading-text');
    function fail(error){
      const detail=String(error?.message||error);
      console.error(error);loading.classList.remove('done');
      message.style.maxWidth='620px';message.style.lineHeight='1.9';message.style.padding='0 24px';
      message.style.whiteSpace='pre-wrap';message.style.letterSpacing='0';
      const gpu=/WebGL|GPU|context lost/i.test(detail);
      message.textContent=(gpu?'当前浏览器未能启用 3D 图形。请使用最新版 Safari、Chrome 或 Edge 打开网址；手机请优先使用系统浏览器。':'场景加载失败，具体原因：')+'\n\n'+detail;
      const link=document.createElement('a');link.textContent=location.protocol==='file:'?'打开本地场景':'重试加载';link.href=location.protocol==='file:'?'http://127.0.0.1:4173/':location.pathname+'?v='+Date.now();link.style.cssText='display:block;margin-top:16px;color:#866241';message.append(link);
      window.__sceneError=detail;
    }
    window.__sceneLoading=step=>{message.textContent=step};
    window.__sceneFail=fail;
    window.addEventListener('error',e=>{if(!window.__sceneReady)fail(e.error||e.message)});
    window.addEventListener('unhandledrejection',e=>fail(e.reason));
    async function checkFile(file){
      const url=new URL('./'+file,location.href);let reason;
      for(let attempt=0;attempt<3;attempt++){
        const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
        try{const response=await fetch(url,{cache:'no-cache',signal:controller.signal});if(!response.ok){const error=new Error('HTTP '+response.status);error.http=true;throw error}await response.arrayBuffer();return file}
        catch(error){reason=error;if(error.http)break;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,350*(attempt+1)))}finally{clearTimeout(timer)}
      }
      const advice=['127.0.0.1','localhost'].includes(url.hostname)?'请确认本地服务仍在运行。':'请检查网络连接并重试；若持续失败，请确认网站已部署完整的场景文件。';
      throw new Error('无法加载场景文件：'+file+'\n请求地址：'+url.href+'\n原因：'+(reason?.name==='AbortError'?'连接超时':reason?.message||String(reason))+'\n'+advice);
    }
    try{
      if(location.protocol==='file:')throw new Error('请通过 http://127.0.0.1:4173/ 打开场景。直接打开 HTML 文件无法加载本地模块。');
      const files=['vendor/three.module.js','vendor/OrbitControls.js','vendor/RoundedBoxGeometry.js','vendor/BufferGeometryUtils.js','scene.js','furniture-system.js','editor.js','object-controls.js','ground-selection.js','placement.js','architecture-system.js','floor-system.js','floor-controls.js','model-thumbnails.js','wall-handles.js','building-system.js','building-controls.js','scene-menu.js'];
      await Promise.all(files.map(checkFile));
      message.textContent='依赖已就绪，正在创建 3D 场景…';
      await import('./scene.js?v=20261010-camera-toggle-1');
    }catch(error){fail(error)}
  </script>
</body>
</html>
